name: Build & Release APK

'on':
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (optional, defaults to v<version> from pubspec.yaml)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build USB IDs Database
        run: python3 tools/build_usbids_db.py

      - name: Build APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare Release APK
        run: |
          cd build/app/outputs/flutter-apk
          APK=$(ls app*arm64*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(ls *.apk 2>/dev/null | head -n 1)
          fi
          echo "Selected APK: $APK"
          cp "$APK" tapducky-arm64-v8a-release.apk
          ls -lh tapducky-arm64-v8a-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapducky-arm64-v8a-release
          path: build/app/outputs/flutter-apk/tapducky-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$VERSION"
          fi

          APK="build/app/outputs/flutter-apk/tapducky-arm64-v8a-release.apk"
          echo "Publishing $APK to release $TAG..."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --generate-notes
          else
            gh release upload "$TAG" "$APK" --clobber
          fi
